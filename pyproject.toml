[project]
name = "langchain-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sudhanshu Deshpande", email = "354603361+deshpandesudhanshu71-glitch@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-tavily>=0.2.18",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
]

[project.scripts]
langchain-search-agent = "langchain_search_agent:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
